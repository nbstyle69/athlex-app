project_id = "battlewod"

[db]
port = 54322
major_version = 17

# Le baseline ALTER `storage.objects`, dont le rôle utilisé par la CLI n'est pas
# propriétaire : l'application automatique échoue. `scripts/test-stack.sh` rejoue
# supabase/migrations en `supabase_admin` juste après le démarrage.
[db.migrations]
enabled = false

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
# Même valeur qu'en prod : chaque flux porte son redirectTo, le Site URL ne route rien.
site_url = "https://athlexapp.eu/email-confirme"
additional_redirect_urls = ["https://athlexapp.eu/**", "https://www.athlexapp.eu/**"]

[analytics]
enabled = false

[edge_runtime]
enabled = false

# ── Fonctions edge : `verify_jwt = false` pour les huit ─────────────────────
# La vérification de la plateforme ne connaît que les JWT signés par l'ancien
# secret : elle refuserait une clé `sb_secret_…` ou `sb_publishable_…`, et
# cassera à la révocation de l'ancien secret JWT. Chaque fonction authentifie
# elle-même son appelant, avant tout accès aux données, et refuse un appel
# sans authentification (401) :
#   * `x-cron-secret` comparé à CRON_SECRET, refus si l'un manque —
#     generate-box-week, session-followup-cron, tournament-notifications-cron,
#     weekly-owner-digest ;
#   * `auth.getUser(jeton)` sur l'en-tête Authorization, refus si absent ou
#     invalide — analyze-tournament-score, parse-wod-pdf, send-box-notification ;
#   * l'un ou l'autre — send-push.
# Versionné ici parce que `scripts/deploy-edge.mjs` copie ce fichier et que la
# CLI le lit au déploiement : sans ces sections, le réglage ne dépendait que de
# l'état de la prod (trois fonctions à false, cinq à true au 23/09/2026).
[functions.analyze-tournament-score]
verify_jwt = false

[functions.generate-box-week]
verify_jwt = false

[functions.parse-wod-pdf]
verify_jwt = false

[functions.send-box-notification]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.session-followup-cron]
verify_jwt = false

[functions.tournament-notifications-cron]
verify_jwt = false

[functions.weekly-owner-digest]
verify_jwt = false
